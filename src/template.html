<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{DESCRIPTION}}">
  <!-- No frame-ancestors here, deliberately. It is ignored in a meta CSP (the
       browser must decide before parsing HTML, so it is header-only), and rvmark
       pages are meant to be embeddable anyway — envoy.html in particular MUST be
       framable cross-origin or federation breaks. Do not add it here or as a
       header without accounting for that. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
    font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
    img-src 'self' data: https:;
    media-src 'self' https:;
    connect-src 'self' https:;
    frame-src 'self' https://www.youtube-nocookie.com https:;
    base-uri 'self';
    form-action 'self';
  ">
  <title>{{TITLE}}</title>
  <link rel="icon" href="{{BASE}}_assets/favicon.svg" type="image/svg+xml">
  <script>
    // The favicon is the tree's own ▶ bullet, and it toggles with tab
    // visibility: the tab you are looking at is ▼ (expanded), and tabs you
    // leave collapse back to ▶. Favicons render as static images, so this is a
    // swap of the href rather than anything animated.
    //
    // The markup's own href stays the collapsed ▶ — that is what crawlers,
    // bookmarks and link previews read, since none of them run this. The
    // expanded state exists only for a live, focused tab.
    //
    // Inline and in <head> so a tab restored in the background never flashes
    // the wrong state. Silently inert if a site ships no
    // favicon-expanded.svg — the browser just keeps the icon it has.
    (function () {
      var link = document.querySelector('link[rel="icon"]');
      if (!link) return;
      var collapsed = link.getAttribute('href');
      var expanded  = collapsed.replace(/favicon\.svg$/, 'favicon-expanded.svg');
      if (expanded === collapsed) return;
      var sync = function () {
        link.setAttribute('href', document.hidden ? collapsed : expanded);
      };
      document.addEventListener('visibilitychange', sync);
      sync();
    })();
  </script>
  <!-- No webfonts. Every family used by the engine falls back to a system face
       (serif / monospace), so a page costs zero third-party font requests and
       has no FOUT. A site that wants a specific face can load it from its own
       theme.css — the engine does not impose one. -->
  <link rel="stylesheet" href="{{BASE}}styles.css">
  <!-- KaTeX is NOT loaded here. It is ~280KB and most pages have no math, so it
       is fetched on demand the first time a math token is parsed — see
       ensureKatex() in markdown.ts. Nodes containing math defer their mount
       until it arrives, so nothing renders unstyled and then upgrades. -->
  <script src="{{BASE}}_vendor/purify.min.js"></script>
  {{SITE_HEAD}}
</head>
<body>
<div id="root">
  <header>
    <h1 id="site-title">{{TITLE}}</h1>
  </header>

  <noscript><style>#static-content{display:block!important}</style></noscript>
  <script>
    // Opened as a local file, not served. The engine is a module, and browsers
    // refuse to load one over file:// — so main.js never runs, nothing reveals
    // the static rendering, and <noscript> does not apply either (JS is on; the
    // script just never arrived). Without this the page is blank. Classic and
    // inline, because those are the two things that do still run here.
    if (location.protocol === 'file:') {
      var s = document.createElement('style');
      s.textContent = '#static-content{display:block!important}';
      document.head.appendChild(s);
    }
  </script>
  <div id="static-content" style="display:none;">
    {{STATIC_HTML}}
  </div>

  <div id="tree-scroll" style="display:none;" tabindex="-1">
    <ul class="tree" id="tree-root" role="tree" aria-labelledby="site-title" tabindex="-1"></ul>
  </div>

  <div id="exhibit-divider"></div>

  <footer>{{FOOTER_LABEL}}{{LICENSE}}{{AUTHOR}}</footer>
</div>

<script>
  window.__RVMARK_PAGE__ = {
    file: "{{RVMARK_FILE}}",
    base: "{{BASE}}"
  };
  window.__RVMARK_SITE_MAP__ = {{SITE_MAP_JSON}};
</script>

<script src="{{BASE}}_vendor/marked.min.js"></script>
<script type="module" src="{{BASE}}_engine/client/main.js"></script>
</body>
</html>
