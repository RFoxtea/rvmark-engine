<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
    font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
    img-src 'self' data: https:;
    media-src 'self' https:;
    connect-src 'self' https:;
    frame-src 'self' https://www.youtube-nocookie.com https:;
    frame-ancestors 'self';
    base-uri 'self';
    form-action 'self';
  ">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="{{BASE}}styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="{{BASE}}_vendor/purify.min.js"></script>
</head>
<body>
<div id="root">
  <header>
    <h1 id="site-title">{{TITLE}}</h1>
  </header>

  <noscript><style>#static-content{display:block!important}</style></noscript>
  <div id="static-content" style="display:none;">
    {{STATIC_HTML}}
  </div>

  <div id="tree-scroll" style="display:none;" tabindex="-1">
    <ul class="tree" id="tree-root" role="tree" aria-labelledby="site-title" tabindex="-1"></ul>
  </div>

  <div id="exhibit-divider"></div>

  <footer><span class="footer-section">rvmark</span>{{LICENSE}}{{AUTHOR}} · <label class="show-hidden-toggle footer-section"><input type="checkbox" id="show-hidden-cb"> show hidden</label></footer>
</div>

<script>
  window.__RVMARK_PAGE__ = {
    file: "{{RVMARK_FILE}}",
    base: "{{BASE}}"
  };
  window.__RVMARK_SITE_MAP__ = {{SITE_MAP_JSON}};
</script>

<script src="{{BASE}}_vendor/marked.min.js"></script>
<script type="module" src="{{BASE}}_engine/main.js"></script>
</body>
</html>
